name: Windows validation
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Install FFmpeg
        shell: pwsh
        run: .github/scripts/setup-ffmpeg.ps1
      - name: Check history, dependencies and syntax
        shell: pwsh
        run: |
          python tools/audit_repository.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = 'build/qa/phase2b-evidence'
          New-Item -ItemType Directory -Force -Path $archive | Out-Null
          git archive --format=tar --output=build/qa/phase2b-evidence.tar 899ad995fc6ffd013e1eac2c25339459887fedc6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/qa/phase2b-evidence.tar -C $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$archive/tools/performance_record.py" "$archive/docs/benchmarks/studio-3.6.0-rendering.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $phase2c = 'build/qa/phase2c-evidence'
          New-Item -ItemType Directory -Force -Path $phase2c | Out-Null
          git archive --format=tar --output=build/qa/phase2c-evidence.tar c499f54ab2a146870b11c3fd350c8d2ab80d4f57
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/qa/phase2c-evidence.tar -C $phase2c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$phase2c/tools/performance_record.py" "$phase2c/docs/benchmarks/studio-3.6.0-phase2c.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $phase2d = 'build/qa/phase2d-evidence'
          New-Item -ItemType Directory -Force -Path $phase2d | Out-Null
          git archive --format=tar --output=build/qa/phase2d-evidence.tar 2520ce60149bdff3392a3e895498af54c1e48b39
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/qa/phase2d-evidence.tar -C $phase2d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$phase2d/tools/performance_record.py" "$phase2d/docs/benchmarks/studio-3.6.0-phase2d.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $phase3a = 'build/qa/phase3a-evidence'
          New-Item -ItemType Directory -Force -Path $phase3a | Out-Null
          git archive --format=tar --output=build/qa/phase3a-evidence.tar f4a852ba36d9cd6e417c2cbfd1dc90af1ad2d630
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/qa/phase3a-evidence.tar -C $phase3a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python "$phase3a/tools/performance_record.py" "$phase3a/docs/benchmarks/studio-3.6.0-phase3a.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $phase3b = 'build/qa/phase3b-checkpoint'
          New-Item -ItemType Directory -Force -Path $phase3b | Out-Null
          git archive --format=tar --output=build/qa/phase3b-checkpoint.tar f2f871ea439a9d6aa1f6323219d796004e8c4f03
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/qa/phase3b-checkpoint.tar -C $phase3b
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $priorRecord = "$phase3b/docs/benchmarks/studio-3.6.0-phase3b.json"
          python "$phase3b/tools/performance_record.py" $priorRecord
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/performance_record.py docs/benchmarks/studio-3.6.0-phase3b.json --historical-record $priorRecord
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/icon_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q -x '[/\\](build|dist|\.git)[/\\]' .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in Get-ChildItem web -Filter *.js) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Python regression
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Offline Python regression (loopback only)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          VLOGCRAFT_OFFLINE_TEST: "1"
        run: |
          $env:PYTHONPATH = Join-Path (Get-Location) 'tests/offline_guard'
          python -m unittest discover -s tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Historical render-drain stress (20 decoded repetitions)
        env:
          PYTHONUTF8: "1"
        run: python benchmarks/drain_stress.py --repeat 20
      - name: JavaScript timeline commands
        run: node --test tests/timeline_commands.test.js tests/native_audio_worklet.test.js tests/native_clock.test.js tests/meter.test.js tests/recovery.test.js tests/flight_recorder.test.js tests/color_controls.test.js tests/motion_presets.test.js
  native-compile:
    runs-on: windows-2022
    timeout-minutes: 20
    needs: regression
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Compile isolated native experiment (no GPU execution)
        run: python tools/setup_architecture_lab.py --component zig --component ffmpeg-shared --build-native
      - name: Install Phase 2 lab dependencies
        shell: pwsh
        run: |
          python -m pip install -r packaging/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .github/scripts/setup-ffmpeg.ps1
      - name: Verify compositor kernels and HDR fallback in software
        shell: pwsh
        run: |
          $reference = 'build/qa/phase2-reference'
          New-Item -ItemType Directory -Path $reference -Force | Out-Null
          git archive --format=tar --output=build/qa/phase2-reference.tar 045da0a6b3d8d956d07c075a6c0e73f6878a2d9f
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf build/qa/phase2-reference.tar -C $reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zig = (Get-ChildItem build/tools/architecture/zig -Filter zig.exe -Recurse | Select-Object -First 1).FullName
          & $zig c++ -target x86_64-windows-gnu -std=c++17 -O3 -shared experiments/render_phase2/hdr_statistics.cpp -o build/qa/hdr-statistics.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/check_phase2c_stats.py build/qa/hdr-statistics.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = (Resolve-Path 'build/tools/architecture/ffmpeg-shared/ffmpeg-9.0.2-full_build-shared').Path
          & $zig c++ -target x86_64-windows-gnu -std=c++17 -O3 -fno-vectorize -fno-slp-vectorize -ffp-contract=off -municode -DVLOGCRAFT_RESIDENT_DECODE experiments/render_phase2/main.cpp "-I$sdk/include" "-L$sdk/lib" -lavformat -lavcodec -lavutil -lswscale -ld3d11 -ld3dcompiler_47 -lpsapi -o build/qa/VlogCraftResident.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VLOGCRAFT_PROJECT_TEST_WORKER = (Resolve-Path build/qa/VlogCraftResident.exe).Path
          $env:VLOGCRAFT_PROJECT_TEST_RUNTIME = "$sdk/bin"
          python -m unittest discover -s tests -p test_native_project_render.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/render_phase2.py build/qa/phase2-warp --reference $reference --compiler $zig --quick --frames 3 --repeat 1 --modes ffmpeg,scalar,simd,warp32 --cases uhd-mask,uhd-dissolve,edge-half --precise-edges --assert-quality
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/render_phase2_export.py build/qa/phase2-fallback --reference $reference --executable build/qa/phase2-warp/VlogCraftRenderLab.exe --quick --frames 3 --precise-edges --force-fallback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/render_phase2_stream.py build/qa/phase2-pipe --executable build/qa/phase2-warp/VlogCraftRenderLab.exe --backend warp32 --quick --frames 8 --loops --compare-disk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/check_phase2b_color.py --executable build/qa/phase2-warp/VlogCraftRenderLab.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/render_phase2_stream.py build/qa/phase2b-pipe --executable build/qa/phase2-warp/VlogCraftRenderLab.exe --backend warp32 --quick --frames 8 --loops --conversion parallel --workers 2 --compare-master build/qa/phase2-pipe/verified-hdr10plus.mp4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/render_phase2_stream.py build/qa/phase2b-live-reference --executable build/qa/phase2-warp/VlogCraftRenderLab.exe --backend warp32 --quick --frames 8 --live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/render_phase2_stream.py build/qa/phase2b-live --executable build/qa/phase2-warp/VlogCraftRenderLab.exe --backend warp32 --quick --frames 8 --live --parallel-decode --conversion parallel --workers 2 --compare-master build/qa/phase2b-live-reference/verified-hdr10plus.mp4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/run_qa.py --results build/qa/phase2c-fallback-supervisor --timeout 90 -- python benchmarks/render_phase2_stream.py build/qa/phase2c-fallback --executable build/qa/VlogCraftResident.exe --backend warp32 --quick --frames 8 --live --parallel-decode --hardware-bin "$sdk/bin" --fast-author --author-dll build/qa/hdr-statistics.dll --author-workers 3 --compare-master build/qa/phase2b-live-reference/verified-hdr10plus.mp4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fallback = Get-Content build/qa/phase2c-fallback/report.json -Raw | ConvertFrom-Json
          if (!$fallback.resident_input_fallback -or !$fallback.independent_master_comparison.passed) { exit 1 }
          python benchmarks/run_qa.py --results build/qa/phase2b-fault-supervisor --timeout 90 -- python benchmarks/render_phase2_stream.py build/qa/phase2b-fault --executable build/qa/phase2-warp/VlogCraftRenderLab.exe --backend warp32 --quick --frames 8 --live --parallel-decode --simulate-device-removal
          if ($LASTEXITCODE -ne 1) { exit 1 }
          $receipt = Get-Content build/qa/phase2b-fault-supervisor/supervisor.json -Raw | ConvertFrom-Json
          if ($receipt.process_ownership.job_members_at_cleanup -ne 0 -or (Test-Path build/qa/phase2b-fault/verified-hdr10plus.mp4) -or !(Select-String -Path build/qa/phase2b-fault/native.json -Pattern 'Injected D3D11 device removal')) { exit 1 }
          exit 0
      # Hosted runners do not qualify hardware decode, presentation or GPU timing.
      # Local QUICK/STANDARD/FULL performance profiles are defined in benchmarks/performance_suite.py.
      # No experimental dependency binaries are uploaded.
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    needs: regression
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Install FFmpeg
        shell: pwsh
        run: .github/scripts/setup-ffmpeg.ps1
      - name: Install WiX 3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/tools/wix | Out-Null
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile build/tools/wix.zip
          Expand-Archive build/tools/wix.zip build/tools/wix -Force
      - name: Build optional native runtime for packaging (no GPU execution)
        run: python tools/setup_architecture_lab.py --component zig --component ffmpeg-shared --build-native --build-project-export
      - name: Build Windows installer
        run: python packaging/build_windows.py --experimental-native --experimental-project-export
      - name: Validate MSI lifecycle and retained data
        env:
          PYTHONUTF8: "1"
        shell: pwsh
        run: |
          $msi=Get-ChildItem release -Filter *.msi | Select-Object -First 1
          python tests/windows_release.py $msi.FullName build/qa/lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_bundle.py dist/VlogCraftStudio build/qa/bundle.json --installed "$env:LOCALAPPDATA/Programs/VlogCraft Studio"
      # Bundled dependencies need corresponding-source review before binary distribution.
      # This job checks packaging and installation. It does not create a public release.
